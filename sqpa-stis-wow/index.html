<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/sqpa-stis-wow/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SQPA × STIS Analyser (WoW) | Growisto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body { margin: 0; font-family: 'Poppins', sans-serif; background: #F6F6F4; color: #1D1D20; }
    </style>
    <script type="module" crossorigin src="/sqpa-stis-wow/assets/index-BZqduidd.js"></script>
    <link rel="stylesheet" crossorigin href="/sqpa-stis-wow/assets/index-nqMpL4T3.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        const TRACKING_URL = 'https://script.google.com/macros/s/AKfycbxf8LQkBGNWOZ7eVYoOvKpcejcbii-ULFaTEsnviP-s4CPxjIFmo7jmXjiTl5JgOLbz/exec';
        const TOOL_NAME    = 'SQPA x STIS Analyser WoW';
        const IDLE_MS = 10*60*1000, BEAT_MS = 60*1000;
        function logEvent(action) {
          const name=sessionStorage.getItem('gs_name'), project=sessionStorage.getItem('gs_project');
          if (!name||!project) return;
          const now=new Date(), _p=new URLSearchParams({date:now.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}),timestamp:now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true}),name,project,tool:TOOL_NAME,action});new Image().src=TRACKING_URL+'?'+_p.toString();
        }
        let beatTimer,idleTimer,isIdle=false;
        function startBeat(){clearInterval(beatTimer);beatTimer=setInterval(()=>{if(!isIdle)logEvent('Heartbeat');},BEAT_MS);}
        function resetIdle(){clearTimeout(idleTimer);if(isIdle){isIdle=false;logEvent('Resumed');startBeat();}idleTimer=setTimeout(()=>{isIdle=true;clearInterval(beatTimer);logEvent('Idle');},IDLE_MS);}
        ['mousemove','click','keypress','scroll','touchstart'].forEach(e=>document.addEventListener(e,resetIdle,{passive:true}));
        window.addEventListener('beforeunload',()=>logEvent('Closed'));
        logEvent('Opened');startBeat();resetIdle();
      })();
    </script>
  </body>
</html>
